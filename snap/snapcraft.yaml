name: echollm
version: '1.0.0'
summary: A privacy-focused AI chat application
description: |
  EchoLLM is a desktop client for interacting with various AI models
  with local API key management and chat history storage.

license: Apache-2.0

base: core24
confinement: strict
grade: stable

platforms:
  amd64:

apps:
  echollm:
    command: echo_llm
    common-id: com.production.echo_llm
    extensions: [gnome]
    plugs:
      - network
      - home
      - opengl
      - audio-playback
      - audio-record
      - gsettings
      - removable-media

parts:
  echollm:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-snaps:
      - flutter/latest/stable
    build-packages:
      - clang
      - cmake
      - ninja-build
      - libgtk-3-dev
      - liblzma-dev
      - libsecret-1-dev
    stage-packages:
      - libgtk-3-0
      - libsecret-1-0
